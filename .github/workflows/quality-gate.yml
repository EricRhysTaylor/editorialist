name: Quality Gate

# Blocking, deterministic quality gates for ordinary pushes/PRs. This workflow
# uses check:ci for the complete lint/test funnel and a portable production build.
# Local vault delivery is a separate explicit build:dev command.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check:ci

      - name: Verify portable review build
        run: npm run build
